[versions]
minecraft = "26.1.2"
flywheel = "1.0.6-mc26.1"   # Round 33: coordinate scheme of the Flywheel 26.1.2 source we build

# https://neoforged.net/
neoforge = "26.1.2.114"
fml-loader = "11.0.12"
night-config = "3.8.3"
mdg = "2.0.+"

# https://fabricmc.net/develop/
loom = "1.16.+"
fabric-loader = "0.19.3"
fabric-api = "0.150.0+26.1.2"

# we need to manually depend on mixin (+extras) in common
mixin = "0.17.3+mixin.0.8.7"
mixin-extras = "0.5.4"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixin-extras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin-extras" }

neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }
fml-loader = { module = "net.neoforged.fancymodloader:loader", version.ref = "fml-loader" }
night-config-core = { module = "com.electronwill.night-config:core", version.ref = "night-config" }
night-config-toml = { module = "com.electronwill.night-config:toml", version.ref = "night-config" }
flywheel-neoforge-api = { module = "dev.engine-room.flywheel:flywheel-neoforge", version.ref = "flywheel" }
flywheel-neoforge = { module = "dev.engine-room.flywheel:flywheel-neoforge", version.ref = "flywheel" }
flywheel-fabric-api = { module = "dev.engine-room.flywheel:flywheel-fabric", version.ref = "flywheel" }
flywheel-fabric = { module = "dev.engine-room.flywheel:flywheel-fabric", version.ref = "flywheel" }

[bundles]
# Round 34: the configuration subsystem lives in `common` but needs NeoForge's config API. Provided compile-only,
# exactly as Ponder PR #85 does, so `common` stays loader-neutral at runtime.
neoforge-config = [ "neoforge", "fml-loader", "night-config-core", "night-config-toml" ]
fabric = [ "fabric-loader", "fabric-api" ]
mixin = [ "mixin", "mixin-extras" ]

[plugins]
mdg = { id = "net.neoforged.moddev", version.ref = "mdg" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }

# convention plugins
configure-platform = { id = "configure-platform" }
setup-git-hash = { id = "setup-git-hash" }
